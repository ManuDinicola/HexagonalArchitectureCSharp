name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - name: Template still installs and generates compilable code
        run: |
          dotnet new install ./templates/hexa-usecase
          mkdir -p src/MyApp.Application/UseCases/CiProbe
          dotnet new hexa-usecase -n CiProbe -o src/MyApp.Application/UseCases/CiProbe
          dotnet build src/MyApp.Application -c Release
